[workspace]
members = ["contract", "test-token"]
resolver = "2"

[package]
name = "leash-sandbox-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
anyhow = "1"
# no system OpenSSL on this box; near-jsonrpc-client pulls native-tls, so build OpenSSL from source
openssl = { version = "0.10", features = ["vendored"] }
near-workspaces = "0.24"
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[[test]]
name = "account_is_frozen"
path = "tests/sandbox/account_is_frozen.rs"

[[test]]
name = "test_token"
path = "tests/sandbox/test_token.rs"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
