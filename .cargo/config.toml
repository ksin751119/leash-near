# `--cfg near` is what makes near-sdk talk to the NEAR host functions.
#
# near-sdk 5.30 moved the low-level environment calls into `near-sdk-env`, where each one is
# wrapped in `execute_target_specific!`. That macro picks the host implementation only under
# `all(near, target_arch = "wasm32")`, and falls back to a pure-Rust "local" implementation
# otherwise. Nothing sets `cfg(near)` by itself: `cargo near build` passes it, and a plain
# `cargo build --target wasm32-unknown-unknown` does not.
#
# Without it, `env::panic_str` compiles to `eprintln!` followed by a bare `panic!()`. The
# release profile sets `panic = "abort"`, so that becomes a wasm `unreachable` trap and the
# message is gone: every `require!` in the contract surfaces on chain as
# `ExecutionError("WebAssembly trap: An `unreachable` opcode was executed.")` with no reason
# attached. The rules sandbox tests found this — they could tell that a rejection happened
# but not which check had rejected it, and the demo page could not have shown a reason
# either. With the flag, the same rejection arrives as
# `HostError(GuestPanic { panic_msg: "only the admin may change rules" })`.
#
# Scoped to the wasm target, not `[build]`. near-sdk-env has a `compile_error!` for
# `cfg(near)` without `target_arch = "wasm32"`, so passing it to a host build is never right.
# (A host build of the contract lib is independently refused by near-sdk unless its
# `unit-testing` or `non-contract-usage` feature is on, which is why `cargo check -p
# leash-contract` does not work in this project while `cargo test` does — the dev-dependency
# enables the feature. That is near-sdk's rule, not this flag's doing.) Under `[target.…]`
# the flag reaches exactly the build that needs it and nothing else.
#
# This file is a fallback, not the guarantee. Cargo ignores `rustflags` here entirely whenever
# the `RUSTFLAGS` environment variable is set, even to the empty string, and config discovery
# is relative to the working directory. The two builds that produce a wasm anyone runs —
# `scripts/build-contract.sh`, which `scripts/deploy.sh` calls, and `build_wasm` in the
# sandbox tests — therefore set the flag themselves, appending to whatever `RUSTFLAGS` already
# holds. `the_contract_wasm_talks_to_the_host_panic_function` fails if a built wasm ever
# misses it.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", "near"]
