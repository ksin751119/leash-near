[package]
name = "leash-sandbox-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
anyhow = "1"
# near-workspaces 0.24 depends on near-jsonrpc-client 0.23 without default-features = false,
# and that crate defaults to native-tls, so OpenSSL is needed on any machine without system
# headers. Vendoring builds it from source.
openssl = { version = "0.10", features = ["vendored"] }
near-workspaces = "0.24"
serde_json = "1"
# The gated methods take a challenge computed from contract state (the node, the credential's
# nonce and the contract's own account id), so no pre-captured fixture can ever match one.
# These tests therefore mint a P-256 key and sign assertions themselves. That a software key
# is accepted is not a flaw being papered over — it is the documented trust boundary
# (see contract/src/webauthn.rs): registration is admin-only precisely because the contract
# cannot tell a secure enclave from a key like this one.
#
# Features mirror the contract's exactly, so nothing here can change how the wasm is built.
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
sha2 = { version = "0.10", default-features = false }
# `Rule` and its Borsh encoding, so the challenge layout is reproduced here from the
# documented byte layout rather than read back out of the contract under test.
leash-contract = { path = "../contract" }
# `unit-testing` is what lets near-sdk compile for the host at all: without it the crate
# emits a compile_error for any non-wasm target, so `cargo check -p leash-sandbox-tests`
# would fail on its own even though a whole-workspace `cargo test` happened to work (the
# contract's own dev-dependency enables the feature, and cargo unifies it). Nothing here
# calls into the mock VM; this only unlocks the host build.
near-sdk = { version = "5", features = ["unit-testing"] }
tokio = { version = "1", features = ["full"] }

[[test]]
name = "account_is_frozen"
path = "tests/sandbox/account_is_frozen.rs"

[[test]]
name = "test_token"
path = "tests/sandbox/test_token.rs"

[[test]]
name = "widen_requires_passkey"
path = "tests/sandbox/widen_requires_passkey.rs"

[[test]]
name = "rules"
path = "tests/sandbox/rules.rs"
